<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        tr,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<title>
    <h1> merged cell</h1>
</title>

<body>

        <table>
            <tr>
                <td rowspan="2"></td>
                <th colspan="2">average</th>
                <td rowspan="2">red eyes</td>
            </tr>
            <tr>
                <td>height</td>
                <td>weight</td>

            </tr>
            <tr>
                <td>males</td>

                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>femals</td>
                <td>1.4</td>
                <td>0.0043</td>
                <td>45%</td>
            </tr>

        </table>
    </div>

</body>

</html>
